let currentFilter='전체';

function renderCards(){
  imgIdx={};
  const grid=document.getElementById('projectsGrid');
  const s=document.getElementById('searchInput').value.toLowerCase();
  const filtered=PROJECTS.filter(p=>{
    const mc=currentFilter==='전체'||p.cat.includes(currentFilter);
    const ms=!s||p.name.toLowerCase().includes(s)||(p.builder||'').toLowerCase().includes(s)||(p.products||'').toLowerCase().includes(s);
    return mc&&ms;
  });
  document.getElementById('resultCount').innerHTML=`총 <strong>${filtered.length}</strong>건의 납품 실적`;
  if(!filtered.length){grid.innerHTML='<div style="grid-column:1/-1;text-align:center;padding:80px 20px;color:#9aa5b4;font-size:15px;">검색 결과가 없습니다.</div>';return}
  grid.innerHTML=filtered.map(p=>`
    <div class="project-card" onclick='openModal(${JSON.stringify(p)})'>
      <div class="card-img-wrap">
        <img src="${getImg(p.no)}" alt="${p.name}" loading="lazy" onerror="this.src='https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?w=600&q=75'"/>
        <span class="card-cat">${p.cat}</span>
        <span class="card-num">No.${String(p.no).padStart(2,'0')}</span>
      </div>
      <div class="card-body">
        <div class="card-title">${p.name}</div>
        <div class="card-meta">
          ${p.builder&&p.builder!=='-'?`<div class="card-meta-row"><span>🏢</span><strong>${p.builder}</strong></div>`:''}
          <div class="card-meta-row"><span>📅</span>${p.year}</div>
          ${p.area?`<div class="card-meta-row"><span>📐</span>${p.area}</div>`:''}
        </div>
      </div>
    </div>`).join('');
}

function setFilter(cat,btn){
  currentFilter=cat;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderCards();
}

function openModal(p){
  document.getElementById('modalImg').src=getImg(p.no);
  document.getElementById('modalCat').textContent=p.cat;
  document.getElementById('modalTitle').textContent=`No.${String(p.no).padStart(2,'0')}  ${p.name}`;
  const fields=[['건설사',p.builder&&p.builder!=='-'?p.builder:null,'🏢'],['준공연도',p.year,'📅'],['연면적',p.area||null,'📐'],['세대수',p.units||null,'🏠']];
  document.getElementById('modalInfoGrid').innerHTML=fields.filter(([,v])=>v).map(([k,v,i])=>`<div class="mil">${i} ${k}</div><div class="miv">${v}</div>`).join('');
  const prods=(p.products||'').split(',').map(s=>s.trim()).filter(Boolean);
  const mp=document.getElementById('modalProducts');
  if(prods.length){mp.style.display='block';mp.innerHTML=`<div class="modal-products-label">납기 제품</div><div class="product-tags">${prods.map(t=>`<span class="product-tag">${t}</span>`).join('')}</div>`}else{mp.style.display='none'}
  document.getElementById('modalBlogLink').innerHTML=p.blog?`<a class="modal-blog-link" href="${p.blog}" target="_blank" rel="noopener">블로그에서 상세 보기 →</a>`:'';
  document.getElementById('modalOverlay').classList.add('open');
  document.body.style.overflow='hidden';
}
function closeModal(e){if(e.target===document.getElementById('modalOverlay'))closeModalDirect()}
function closeModalDirect(){document.getElementById('modalOverlay').classList.remove('open');document.body.style.overflow=''}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModalDirect()});
renderCards();
</script>
